# Runs the automated checks on every push and pull request.
# Results: GitHub → the repository → Actions. A red X means something broke; don't merge until it's green.
name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  app:
    name: App and logic
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the server code parses
        run: node --check functions/index.js && node --check public/app.js && node --check public/sw.js
      - name: Install
        working-directory: tests
        run: npm install && npm install --no-save @hebcal/core @hebcal/learning && npx playwright install --with-deps chromium
      - name: Run tests
        working-directory: tests
        run: npm test
  rules:
    name: Security rules (emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: npm install --prefix tests/rules
      - name: Run rules tests against the Firestore emulator
        run: npx --yes firebase-tools@latest emulators:exec --only firestore --project demo-shared-plate "npm --prefix tests/rules test"
